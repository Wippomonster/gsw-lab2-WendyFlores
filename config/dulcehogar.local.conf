# /etc/apache2/sites-available/dulcehogar.local.conf
# Versión FINAL (Fase 4): el puerto 8085 solo redirige a HTTPS :4443.
# Las versiones anteriores (Fase 2 y Fase 3) están documentadas en
# fase2-apache.txt y fase3-reverseproxy.txt.

<VirtualHost *:8085>
    ServerName dulcehogar.local

    Redirect permanent / https://dulcehogar.local:4443/

    ErrorLog ${APACHE_LOG_DIR}/dulcehogar.local-error.log
    CustomLog ${APACHE_LOG_DIR}/dulcehogar.local-access.log combined
</VirtualHost>
