# /etc/apache2/sites-available/dulcehogar.local-ssl.conf
# Virtual Host HTTPS (Fase 4) con certificado mkcert + reverse proxy a Express.
# IMPORTANTE: 172.31.160.1 es la IP del host Windows vista desde WSL2.
# Cambiarla por la que muestre "ip route show | grep default".

<IfModule mod_ssl.c>
<VirtualHost *:4443>
    ServerName dulcehogar.local
    DocumentRoot /var/www/dulcehogar.local

    <Directory /var/www/dulcehogar.local>
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile    /etc/apache2/ssl/dulcehogar.local/dulcehogar.local.pem
    SSLCertificateKeyFile /etc/apache2/ssl/dulcehogar.local/dulcehogar.local-key.pem

    # Reverse proxy hacia Express (Windows, puerto 9090)
    ProxyPreserveHost On
    ProxyPass        /api http://172.31.160.1:9090/api
    ProxyPassReverse /api http://172.31.160.1:9090/api

    # Agregado (no venía en la guía): sin estas líneas las peticiones
    # HTTPS se registran en other_vhosts_access.log y no en el log del sitio.
    ErrorLog ${APACHE_LOG_DIR}/dulcehogar.local-error.log
    CustomLog ${APACHE_LOG_DIR}/dulcehogar.local-access.log combined
</VirtualHost>
</IfModule>
